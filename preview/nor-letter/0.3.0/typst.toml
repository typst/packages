[package]
name = "nor-letter"
version = "0.3.0"
entrypoint = "src/lib.typ"
authors = ["Kristian Hanstad"]
license = "MIT"
description = "Create business letters and other documents according to Norwegian Standard 4129:1995. Strict template with correct placing of addresses and plenty of other metadata."
repository = "https://github.com/turbohanstad/typst-nor-letter"
categories = ["office", "layout"]
keywords = ["office", "letter", "memo", "Norwegian",]
exclude = ["examples/"]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "template/thumbnail.png"
