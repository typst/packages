project:
  type: book

book:
  title: "typograph"
  author: "Benjamin Cichos"
  description: "A neutral, themeable diagram engine for Typst"
  repo-url: "https://github.com/BenCichos/typograph"
  repo-actions: [edit, issue]
  repo-subdir: docs/quarto
  chapters:
    - index.qmd
    - part: "Guide"
      chapters:
        - concepts.qmd
        - nodes.qmd
        - shapes.qmd
        - edges.qmd
        - theming.qmd
        - configuration.qmd
        - fragments.qmd
    - part: "Developer Guide"
      chapters:
        - dev/architecture.qmd
        - dev/performance.qmd
        - dev/extending.qmd
        - dev/testing.qmd
    - part: "Reference"
      chapters:
        - reference/diagram.qmd
        - reference/nodes.qmd
        - reference/shapes.qmd
        - reference/edges.qmd
        - reference/theme.qmd
        - reference/content.qmd

format:
  html:
    theme: cosmo
    code-copy: true
    code-overflow: wrap
    toc: true
