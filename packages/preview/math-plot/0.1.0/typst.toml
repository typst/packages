[package]
name = "math-plot"
version = "0.1.0"
entrypoint = "lib.typ"
authors = ["Heberto del Rio", "Nathan Scheinmann"]
license = "MIT"
description = "Plotting library for mathematics instruction: 2D plots, vector fields, contour lines, 3D surfaces"
keywords = ["plot", "graph", "function", "math", "visualization", "calculus", "3d", "vector-field", "contour"]
categories = ["visualization"]
disciplines = ["mathematics", "physics", "engineering"]
compiler = "0.13.0"
exclude = ["docs/*", "gallery", "tests", "*.pdf"]

[dependencies]
cetz = "0.5.2"
komet = "0.2.0"
tiptoe = "0.4.0"
