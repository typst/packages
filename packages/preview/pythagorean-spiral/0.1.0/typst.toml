[package]
name = "pythagorean-spiral"
version = "0.1.0"
entrypoint = "lib.typ"
authors = ["FERGOUS Abdelhak <@fergousA>"]
license = "MIT"
description = "Draw the Spiral of Theodorus (the Pythagorean snail): N right triangles with an exact a·√n labelling system — starting-leg length a, every hypotenuse labelled with its exact value (values, formulas √n, or a custom function), labels rotated parallel to their rays, optional new-leg labels pushed outside, gradients, direction, modes, right-angle marks and more. No dependencies."
keywords = [
  "spiral",
  "theodorus",
  "pythagoras",
  "geometry",
  "triangles",
  "education",
  "math",
  "lengths",
  "labels",
]
categories = ["graphics", "visualization", "fun", "worksheet", "education"]
compiler = "0.13.0"
exclude = [
  "/tools",
  "/verify",
  "*.pdf",
  "*.png"
]
