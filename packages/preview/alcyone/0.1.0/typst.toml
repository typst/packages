[package]
name = "alcyone"
version = "0.1.0"
compiler = "0.15.0"
entrypoint = "lib.typ"
repository = "https://codeberg.org/haydn/alcyone"
authors = ["Haydn Trowell"]
license = "GPL-3.0-or-later"
description = "Bold, typography-driven slides with procedural backgrounds."
keywords = ["slides", "presentation", "typography", "variable-font"]
categories = ["presentation"]
exclude = ["example"]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"

[tool.Typesetter]
name = "Alcyone"
