# yaml-language-server: $schema=../theme.schema.json
# "Crimson" theme of typtorial: a red gradient with white text and a light
# code panel. It ships with the package:
#   #import "@preview/typtorial:0.1.0": tutorial, themes
#   #show: tutorial.with(theme: themes.crimson)
# Settings that are missing here are taken from default.theme.yaml next to this file.

fonts:
  text: [Helvetica Neue, Arial, Liberation Sans, DejaVu Sans]
  code: [Menlo, Consolas, DejaVu Sans Mono]
  brand: [Helvetica Neue, Arial, Liberation Sans, DejaVu Sans]

colors:
  background: "#7a1f24"     # dark red at the top left
  background-gradient: "#e03a3c"   # light red at the bottom right
  text: "#ffffff"
  accent: "#ffffff"
  heading: "#ffffff"
  line: "#e9a3a8"
  code-background: "#f0f1f5"   # light panel
  code-text: "#1c1c1c"
  button: "#b70032"
  button-text: "#ffffff"

brand:
  text: typtorial

layout:
  dots: false
  corner-radius: 1
  title-underline: false
  title-uppercase: false

# Dark color scheme: the same gradient, much darker, with a dark panel.
dark:
  colors:
    background: "#190b0d"
    background-gradient: "#5e161c"
    accent: "#ffffff"
    heading: "#ffffff"
    line: "#6b3a40"
    code-background: "#1e1f24"
    code-text: "#f0f1f5"
    button: "#b70032"
    button-text: "#ffffff"
