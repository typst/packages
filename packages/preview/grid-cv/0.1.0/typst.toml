[package]
name = "grid-cv"
version = "0.1.0"
entrypoint = "src/lib.typ"
authors = ["JobSprout <https://jobsprout.ai>"]
license = "MIT AND MIT-0"
description = "Plain single-column CV with a two-column skills grid."
homepage = "https://www.jobsprout.ai/resume-templates/grid"
repository = "https://github.com/davidculemann/typst-templates"
keywords = ["cv", "resume", "ATS"]
categories = ["cv"]
compiler = "0.12.0"
exclude = ["doc"]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"
