[package]
name = "na-tabpos"
version = "0.1.0"
authors = ["Naam Mohamed"]
license = "MIT"
description = "Sign, variation and relative-position tables for Arabic math documents, built on vartable (adds a relative-position row with arcs)."
repository = "https://github.com/naam11/packages"
keywords = ["arabic", "rtl", "math", "variation table", "sign table", "relative position"]
categories = ["visualization"]
entrypoint = "lib.typ"
compiler = "0.13.0"
exclude = [
  "documentationEN.typ",
  "documentationAR.typ",
  "all-cases.typ",
  "custom-names.typ",
  "diff_height.typ",
  "hachurage_pos.typ",
  "hatched-domain.typ",
  "line-and-curve.typ",
  "*.png"
]
