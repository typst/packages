# for a description of available keys, see https://github.com/typst/packages/?tab=readme-ov-file#package-format

[package]
name = "basic-resume"
version = "0.2.10"
entrypoint = "src/lib.typ"
authors = ["Stephen Xu <https://stuxf.dev>"]
license = "Unlicense"
compiler = "0.13.0"
description = "A simple, standard resume, designed to work well with ATS."
repository = "https://github.com/stuxf/basic-typst-resume-template"
keywords = ["cv", "resume", "ATS"]
categories = ["cv"]
exclude = [
	"/.github/",
	"/docs/",
	"/scripts/",
	"/tests/",
	"/Justfile",
	"/out/",
	"/dist/",
	"/example-resume.pdf",
	"/example-resume.png",
]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"

[tool.tytanic]
tests = "tests"

[tool.tytanic.default]
ppi = 144.0
max-delta = 1
max-deviations = 0
