<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Vandelay Industries logo">
  <title>Vandelay Industries</title>
  <defs>
    <clipPath id="globe">
      <circle cx="100" cy="100" r="58"/>
    </clipPath>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5c8a"/>
      <stop offset="1" stop-color="#14304f"/>
    </linearGradient>
  </defs>

  <!-- Back half of the orbit ring (passes behind the globe) -->
  <g transform="rotate(-18 100 100)">
    <ellipse cx="100" cy="100" rx="88" ry="24" fill="none" stroke="#c8962e" stroke-width="7"/>
  </g>

  <!-- Globe -->
  <circle cx="100" cy="100" r="58" fill="url(#sea)"/>
  <g clip-path="url(#globe)" fill="none" stroke="#8fb6d9" stroke-width="2.2" opacity="0.85">
    <!-- meridians -->
    <ellipse cx="100" cy="100" rx="20" ry="58"/>
    <ellipse cx="100" cy="100" rx="42" ry="58"/>
    <line x1="100" y1="40" x2="100" y2="160"/>
    <!-- parallels -->
    <line x1="40" y1="100" x2="160" y2="100"/>
    <path d="M48 72 Q100 82 152 72"/>
    <path d="M48 128 Q100 118 152 128"/>
  </g>

  <!-- Retro horizontal slicing across the lower globe -->
  <g clip-path="url(#globe)" fill="#ffffff">
    <rect x="30" y="134" width="140" height="3"/>
    <rect x="30" y="143" width="140" height="4"/>
    <rect x="30" y="153" width="140" height="5"/>
  </g>

  <!-- Highlight -->
  <path d="M66 74 A40 40 0 0 1 96 52" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

  <!-- Front half of the orbit ring -->
  <g transform="rotate(-18 100 100)">
    <path d="M12 100 A88 24 0 0 0 188 100" fill="none" stroke="#e0b04a" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Name banner across the equator -->
  <rect x="28" y="86" width="144" height="30" fill="#b23a2e"/>
  <rect x="28" y="86" width="144" height="30" fill="none" stroke="#e0b04a" stroke-width="2.5"/>
  <text x="100" y="108.5" text-anchor="middle" font-family="'Futura', 'Century Gothic', 'Trebuchet MS', Arial, sans-serif" font-size="21" font-weight="700" font-style="italic" letter-spacing="2.5" fill="#ffffff">VANDELAY</text>

  <!-- Small cargo "satellite" on the ring -->
  <g transform="rotate(-18 100 100)">
    <circle cx="178" cy="112" r="7" fill="#b23a2e" stroke="#ffffff" stroke-width="2.5"/>
  </g>
</svg>
