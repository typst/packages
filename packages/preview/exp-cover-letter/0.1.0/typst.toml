# for a description of available keys, see https://github.com/typst/packages/?tab=readme-ov-file#package-format

[package]
name = "exp-cover-letter"
version = "0.1.0"
entrypoint = "src/lib.typ"
authors = ["tahzeer <https://github.com/tahzeer>"]
license = "Unlicense"
description = "Cover letter that matches an exp-resume header."
repository = "https://github.com/tahzeer/exp-cover-letter-template"
keywords = ["cover-letter", "cv", "letter"]
categories = ["cv"]
exclude = [
	".github",
	".gitattributes",
	".gitignore",
	"docs",
	"scripts",
	"tests",
	"build",
	"/example-letter.pdf",
	"/example-letter.png",
	".typstignore",
	"Justfile",
]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"
