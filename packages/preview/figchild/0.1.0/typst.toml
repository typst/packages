[package]
name = "figchild"
version = "0.1.0"
entrypoint = "lib.typ"
authors = [
  "Fernando de Souza Bastos (original LaTeX package)",
  "FERGOUS Abdelhak <@fergousA>",
]
license = "LPPL-1.3c"
description = "A faithful port of the LaTeX figchild package: 561 colourful figures for children's activities, rendered with CeTZ (exact) or Scrawl (hand-drawn)."
repository = "https://github.com/fergousA/figchild"
keywords = [
  "figures",
  "children",
  "education",
  "activities",
  "tikz",
  "cetz",
  "scrawl",
]
categories = ["fun"]
compiler = "0.13.0"
exclude = [
  "/verify",
  "/tools",
  "*.pdf", 
  "*.png",
]
