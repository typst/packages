[package]
name = "modernpro-cv"
version = "2.1.1"
entrypoint = "modernpro-cv.typ"
authors = [ "Academic Template Collective",]
license = "MIT"
description = "A clean, modern CV template for academic and professional applications."
keywords = [ "cv", "resume", "academic",]
