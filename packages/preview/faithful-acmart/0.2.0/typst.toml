[package]
name = "faithful-acmart"
version = "0.2.0"
entrypoint = "src/lib.typ"
authors = ["Fabian Zaiser <fzaiser@mit.edu>"]
license = "MIT AND MIT-0"
description = "Every ACM paper format, matching LaTeX acmart."
repository = "https://github.com/fzaiser/faithful-acmart"
keywords = [
    "acmart",
    "ACM",
    "Association for Computing Machinery",
    "LaTeX",
    "sigconf",
    "acmsmall",
]
categories = ["paper"]
disciplines = ["computer-science"]
# Required for the math symbol names and PDF tagging used by the package.
compiler = "0.14.0"
exclude = [
    "/.github",
    "/.venv",
    "/acmart",
    "/fonts",
    "/tests",
    "/tools",
    "/tmp",
    "/scratch",
    "/.gitignore",
    "/.python-version",
    "/CLAUDE.md",
    "/CONTRIBUTING.md",
    "/DESIGN.md",
    "/PUBLISHING.md",
    "/TODO.md",
    "/pyproject.toml",
    "/uv.lock",
    "/src/assets/acm-jdslogo.png",
]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"
