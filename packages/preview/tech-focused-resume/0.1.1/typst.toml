# for a description of available keys, see https://github.com/typst/packages/?tab=readme-ov-file#package-format

[package]
name = "tech-focused-resume"
version = "0.1.1"
entrypoint = "src/lib.typ"
authors = ["Guilherme de Biazi Figueira <@GuilhermeFigueira>"]
license = "MIT AND MIT-0"
description = "Modular, ATS-friendly résumé for software developers."
repository = "https://github.com/guilhermefigueira/tech-focused-resume-template"
keywords = ["cv", "resume", "technical", "modular", "customizable", "ATS"]
categories = ["cv"]
exclude = [
  "tests",
  ".gitignore",
  ".github",
  "scripts",
  ".typstignore",
  "example.pdf",
  "example.png",
]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"
