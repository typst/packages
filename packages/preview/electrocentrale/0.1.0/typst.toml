[package]
name = "electrocentrale"
version = "0.1.0"
entrypoint = "lib.typ"
authors = ["léon <@leonpwd>"]
license = "MIT"
description = "Templates for ECE (École Centrale d'Électronique, a French engineering school) lab and project reports."
homepage = "https://www.ece.fr"
repository = "https://github.com/ece-elec/Electrocentrale"
keywords = ["electrocentrale", "electrocentralien", "ece", "ecole-centrale-d-electronique", "ece-paris", "report", "engineering"]
categories = ["report"]
disciplines = ["engineering", "computer-science"]
compiler = "0.12.0"
exclude = [
  "*.pdf",
]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"
