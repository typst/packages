[package]
name = "keisen"
version = "0.1.0"
compiler = "0.15.0"
entrypoint = "lib.typ"
authors = ["Mickaël Canouil <https://mickael.canouil.fr>"]
license = "MIT"
description = "Create elegant display tables from tabular data."
repository = "https://github.com/mcanouil/keisen"
homepage = "https://m.canouil.dev/keisen"
keywords = ["table", "display-table", "formatting", "reporting"]
# Functional categories, from the list upstream publishes in docs/CATEGORIES.md.
# "report" was a publication category, which upstream describes as mattering to
# template packages: this is a library a document uses.
categories = ["visualization", "components"]
exclude = [
  ".editorconfig",
  ".github",
  ".gitignore",
  "docs",
  "examples",
  "tests",
  "tools",
  "ARCHITECTURE.md",
  "CHANGELOG.md",
  "CITATION.cff",
  "CONTRIBUTING.md",
  "GLOSSARY.md",
]
