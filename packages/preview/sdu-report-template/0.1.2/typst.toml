[package]
name = "sdu-report-template"
version = "0.1.2"
entrypoint = "lib.typ"
authors = ["xmdjy <xmdjy703@outlook.com>"]
license = "MIT"
description = "Experimental reports for Shandong University students."
repository = "https://github.com/xmdjy/sdu-report-template"
keywords = ["sdu", "Shandong University", "experimental report"]
compiler = "0.13.0"
exclude = ["examples", "assets/exp.png", "assets/sdu-report-image.png", "images"]
categories = ["report"]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"
