[package]
name = "meridian-cv"
version = "0.1.0"
entrypoint = "src/lib.typ"
authors = ["JobSprout <https://jobsprout.ai>"]
license = "MIT AND MIT-0"
description = "Serif CV with a flush-right masthead and mirrored axis."
homepage = "https://www.jobsprout.ai/resume-templates/meridian"
repository = "https://github.com/davidculemann/typst-templates"
keywords = ["cv", "resume", "academic"]
categories = ["cv"]
compiler = "0.12.0"
exclude = ["doc"]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"
