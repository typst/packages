# The words abntly writes, by the language of the text (`text.lang`), read by the package linguify (src/words.typ). A
# language that is not here falls back to Portuguese; `config-names(...)`, in the `names` of the main function,
# replaces any of them, in any language.
[conf]
default-lang = "pt"

[lang.pt]
# the running header, "Capítulo 1. Introdução"
chapter = "Capítulo"
# the page of a part, "Parte I"
part = "Parte"
# the designative words of the illustrations the package adds (Typst names the figures and the tables itself)
algorithm = "Algoritmo"
frame = "Quadro"
# what goes under an illustration or a table (14724, 5.8), and the source of a work of the author
source = "Fonte"
legend = "Legenda"
note = "Nota"
own-work = "Elaboração própria."
# the table that goes on over pages (IBGE, 8.3)
continues = "(continua)"
continuation = "(continuação)"
conclusion = "(conclusão)"
# the titles of the outline and of the list of references
contents = "Sumário"
references = "Referências"
# the names `auto-ref` gives, capitalised (a decision of the package); the page as the ABNT writes it, "p. 1" (10520,
# 6.2.4: "precedido pela letra p em minúscula, acompanhada de ponto"). A primary section takes `chapter`, a figure
# its own supplement; a footnote keeps its call (10520, 8)
section = "Seção"
subsection = "Subseção"
subsubsection = "Subsubseção"
appendix-name = "Apêndice"
annex-name = "Anexo"
equation = "Equação"
page = "p."
# the pages that print the data of the work (the words come without the colon, which the page writes): the labels of
# the advisors, by gender (`gender: "f"` in config-info), the area of concentration, the line of the approval sheet
advisor = "Orientador"
advisor-female = "Orientadora"
co-advisor = "Coorientador"
co-advisor-female = "Coorientadora"
area = "Área de concentração"
approved = "Trabalho aprovado"
# the stamps of the drafts of the approval sheet and of the catalog card (`draft: true`)
approval-provisional = "FOLHA PROVISÓRIA"
approval-provisional-note = "A folha definitiva é assinada pela banca após a defesa"
card-provisional = "FICHA PROVISÓRIA"
card-provisional-note = "A ficha definitiva é emitida pela biblioteca da instituição"
# the last tracing of the catalog card, "IV. Título"
card-title = "Título"
# the types of work of config-info (`work-type`), as the note of the catalog card writes them
tcc = "Trabalho de Conclusão de Curso"
dissertation = "Dissertação (Mestrado)"
thesis = "Tese (Doutorado)"
master-qualification = "Qualificação (Mestrado)"
doctorate-qualification = "Qualificação (Doutorado)"
# the bookmarks of the PDF of the pages without a title
title-page = "Folha de rosto"
approval-page = "Folha de aprovação"
dedication = "Dedicatória"
epigraph = "Epígrafe"
# the titles of the pre-textual and post-textual elements, and the label of the keywords (NBR 6028, 4.1.7)
abstract = "Resumo"
keywords = "Palavras-chave"
errata = "Errata"
acknowledgments = "Agradecimentos"
list-of-figures = "Lista de ilustrações"
list-of-tables = "Lista de tabelas"
list-of-frames = "Lista de quadros"
list-of-acronyms = "Lista de abreviaturas e siglas"
list-of-symbols = "Lista de símbolos"
glossary = "Glossário"
index = "Índice"
index-see = "ver"
index-see-also = "ver também"
appendix = "APÊNDICE"
annex = "ANEXO"
appendices = "Apêndices"
annexes = "Anexos"

[lang.en]
chapter = "Chapter"
part = "Part"
algorithm = "Algorithm"
frame = "Frame"
source = "Source"
legend = "Legend"
note = "Note"
own-work = "Prepared by the author."
continues = "(continued)"
continuation = "(continued)"
conclusion = "(concluded)"
contents = "Contents"
references = "References"
section = "Section"
subsection = "Subsection"
subsubsection = "Subsubsection"
appendix-name = "Appendix"
annex-name = "Annex"
equation = "Equation"
page = "p."
advisor = "Supervisor"
advisor-female = "Supervisor"
co-advisor = "Co-supervisor"
co-advisor-female = "Co-supervisor"
area = "Concentration area"
approved = "Approved"
approval-provisional = "PROVISIONAL SHEET"
approval-provisional-note = "The final sheet is signed by the board after the defense"
card-provisional = "PROVISIONAL CARD"
card-provisional-note = "The final card is issued by the institution's library"
card-title = "Title"
tcc = "Final Course Work"
dissertation = "Dissertation (Master's)"
thesis = "Thesis (Doctorate)"
master-qualification = "Qualification (Master's)"
doctorate-qualification = "Qualification (Doctorate)"
title-page = "Title page"
approval-page = "Approval"
dedication = "Dedication"
epigraph = "Epigraph"
abstract = "Abstract"
keywords = "Keywords"
errata = "Errata sheet"
acknowledgments = "Acknowledgements"
list-of-figures = "List of Figures"
list-of-tables = "List of Tables"
list-of-frames = "List of Frames"
list-of-acronyms = "List of abbreviations and acronyms"
list-of-symbols = "List of symbols"
glossary = "Glossary"
index = "Index"
index-see = "see"
index-see-also = "see also"
appendix = "APPENDIX"
annex = "ANNEX"
appendices = "Appendices"
annexes = "Annexes"

# The abstract in another language (NBR 14724, 4.2.1.8: "resumo em língua estrangeira"): its title and the label
# of its keywords (Résumé, Mots-clés; Resumen, Palabras clave). Only these two words: a work in Spanish or French
# gives the others in `names`.
[lang.es]
abstract = "Resumen"
keywords = "Palabras clave"

[lang.fr]
abstract = "Résumé"
keywords = "Mots-clés"
