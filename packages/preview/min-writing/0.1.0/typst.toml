[package]
name = "min-writing"
version = "0.1.0"
entrypoint = "src/lib.typ"
authors = ["Maycon F. Melo <@mayconfmelo>"]
license = "MIT-0"
description = "Quick and simple general-purpose notes with extended syntax"
categories = [ "layout", "office" ]
keywords = [ "quick writing", "note", "annotation", "mobile" ]
repository = "https://github.com/mayconfmelo/min-writing"
exclude = [
  "dev/",
  "tests/",
  "docs/",
  "scripts/",
  ".git",
  ".github/",
  ".gitignore",
  "justfile",
  "manual.typ"
]


[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"