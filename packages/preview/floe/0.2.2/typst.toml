[package]
name = "floe"
version = "0.2.2"
entrypoint = "lib.typ"
authors = ["SpanishSyntax <spanishsyntax@pyritelabs.cc>"]
license = "MIT"
description = "Universal 5-layer Typst design system: tokenized primitives, equal-height layouts, multi-science chemistry/physics/plotting engines, pedagogical callouts, and master document presets."
homepage = "https://github.com/SpanishSyntax/Floe"
repository = "https://github.com/SpanishSyntax/Floe"
keywords = ["ui", "components", "design-system", "layout", "textbook", "callout", "tokens"]
categories = ["components", "layout", "book"]
compiler = "0.14.1"
exclude = [
  ".git",
  ".github",
  "tests",
  "docs",
  "assets",
  "examples",
  "scripts",
  "CONTRIBUTING.md",
  "floe.json"
]
