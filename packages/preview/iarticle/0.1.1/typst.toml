[package]
name = "iarticle"
version = "0.1.1"
compiler = "0.15.0"
entrypoint = "lib.typ"
authors = ["Hideo Takahashi"]
license = "MIT"
description = "i18n-aware article and report templates"
repository = "https://github.com/hideo67/iarticle"
keywords = ["i18n", "l10n", "article", "report", "japanese"]
categories = ["paper","report"]
exclude = ["/samples/*"]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"
