[package]
name = "panfig"
version = "0.1.0"
authors = ["Xuelin Yang <xuelin@adamanteye.cc>"]
license = "MIT"
compiler = "0.15.0"
categories = ["visualization", "utility"]
entrypoint = "lib.typ"
description = "Import PGF, TikZ and SVG figures as Typst content."
repository = "https://github.com/adamanteye/panfig"
exclude = [
    "examples",
    ".github",
    "src",
    "image",
    "tests",
    "Makefile",
    "tex",
    "target",
    "AGENTS.md*",
    "Cargo.*",
]
