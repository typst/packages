[package]
name = "deixis"
version = "0.2.0"
entrypoint = "src/lib.typ"
authors = [
  "Hoang-Nhat Tran <hnhat.tran@gmail.com>"
]
license = "MIT"
description = "Typeset decoupled notes, connectors, and spatial highlights."
repository = "https://github.com/inspiros/typst-deixis"
keywords = ["layout", "positioning", "mark", "inline-mark", "region-mark", "note", "inline-note", "footnote", "endnote", "margin-note", "sidenote", "inset-note", "pin", "arrow", "draw"]
categories = ["layout", "utility"]
compiler = "0.15.0"
exclude = ["CHANGELOG.md", "AGENTS.md", "CLAUDE.md", "CONTRIBUTING.md", "requirements-dev.txt", "book.toml", ".git", ".github", ".gitignore", ".gitattributes", ".agents", ".claude", ".codex", ".aws", "develop", "target", "tests", "docs", "scripts", "skills", "examples", "assets/readme", "assets/logos", "*.pdf", "**/*.pdf", "__pycache__", "**/__pycache__", ".venv", ".pytest_cache", "*.py[cod]"]
