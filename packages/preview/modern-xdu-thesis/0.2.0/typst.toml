[package]
name = "modern-xdu-thesis"
version = "0.2.0"
entrypoint = "lib.typ"
authors = ["JackZhu"]
license = "MIT"
description = "A thesis template for academic and professional master's and doctoral theses and undergraduate theses at Xidian University. 西安电子科技大学硕士、博士学术/专业学位论文与本科毕业设计论文模板。"
repository = "https://github.com/CoderJackZhu/modern-xdu-thesis"
keywords = ["Xidian University", "thesis", "xdu", "master thesis", "doctoral thesis", "bachelor thesis"]
categories = ["thesis"]
exclude = ["docs", "dev", "AGENTS.md", ".gitignore", "examples"]
compiler = "0.15.0"

[template]
path = "template"
entrypoint = "thesis.typ"
thumbnail = "thumbnail.png"
