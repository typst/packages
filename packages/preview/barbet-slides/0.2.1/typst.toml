[package]
name = "barbet-slides"
version = "0.2.1"
entrypoint = "lib.typ"
authors = ["Zhen Huang <https://github.com/zhenhuang-tw>"]
license = "GPL-3.0-or-later AND MIT-0"
description = "Traditional Chinese slides for law school presentations."
repository = "https://github.com/zhenhuang-tw/barbet-slides"
compiler = "0.15.0"
categories = ["presentation", "components", "layout"]
