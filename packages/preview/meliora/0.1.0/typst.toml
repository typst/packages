[package]
name = "meliora"
version = "0.1.0"
compiler = "0.15.0"
entrypoint = "lib.typ"
repository = "https://codeberg.org/haydn/meliora"
authors = ["Haydn Trowell"]
license = "GPL-3.0-or-later"
description = "Student essays in MLA style."
keywords = ["essay", "MLA", "report"]
categories = ["report"]
exclude = ["example"]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"

[tool.Typesetter]
name = "Meliora"

