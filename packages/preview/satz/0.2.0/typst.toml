[package]
name = "satz"
version = "0.2.0"
compiler = "0.15.0"
entrypoint = "lib.typ"
authors = ["Kyle Kahraman <kylekahraman@gmail.com>"]
description = "A unified document class for everyday documents — letters, invoices, reports, journals, and grant proposals. Inspired by KOMA-Script."
license = "MIT"
repository = "https://github.com/kylekahraman/satz"
keywords = ["letter", "invoice", "report", "journal", "cover", "koma-script", "class"]
categories = ["components", "layout", "text"]
disciplines = ["communication", "education"]
exclude = [".DS_Store", ".edist", "testing", "examples/**", "dfg-proposal/example.typ", "dfg-proposal/example-de.typ", "proposal/example.typ", "nwo-proposal/veni.typ", "nwo-proposal/vidi.typ", "nwo-proposal/vici.typ", "nwo-proposal/vici-full.typ", "tools/**", "skills/**", "workbook-conversion/**", "AGENTS.md", "TODO.md", "letter/heading-test.typ", "*.pdf", "letter/example.typ", "journal/example.typ", "report/example.typ", "docs/site/**", "docs/archive/**", "astro.config.mjs", "package.json", "package-lock.json", "tsconfig.json", "src/**", "node_modules/**", ".astro/**", "site/**", ".github/**"]
