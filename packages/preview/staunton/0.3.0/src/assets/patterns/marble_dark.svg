<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <!-- Variant B: fuzzier and fainter than A. Wider, lower vein hump (peak 0.4,
       broader shoulders) so veins read as soft haze rather than distinct lines.
       Same near-black cloud. -->
  <filter id="cd" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.008" numOctaves="3" seed="11" result="n"/>
    <feColorMatrix in="n" type="matrix" values="
      0    0    0    0 0.02
      0    0    0    0 0.05
      0    0    0    0 0.02
      -0.7 -0.7 -0.7 0 1.0"/>
  </filter>
  <filter id="vn" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.011 0.015" numOctaves="3" seed="8" result="n"/>
    <feColorMatrix in="n" type="matrix" values="
      0    0    0    0 0.96
      0    0    0    0 0.96
      0    0    0    0 0.96
      0.34 0.33 0.33 0 0"/>
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 0 0 0 0 0.08 0.18 0.28 0.36 0.4 0.4 0.4 0.36 0.28 0.18 0.08 0 0 0 0 0"/>
    </feComponentTransfer>
  </filter>
  <rect width="200" height="200" filter="url(#cd)"/>
  <rect width="200" height="200" filter="url(#vn)"/>
</svg>
