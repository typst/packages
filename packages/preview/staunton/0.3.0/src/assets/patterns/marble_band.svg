<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <!-- Band-scale sibling of marble_dark.svg. A "border"-mode band is rendered
       as ONE image spanning the whole band rect (~7.3cm for a default board)
       rather than one square (~0.8cm), roughly 10x the linear size, so
       both baseFrequency values here are 10x marble_dark.svg's to keep the
       veining looking like veining instead of washing out to near-flat white.
       There is no light-marble band variant: the band always sits on the dark
       bottle-green backdrop.

       The veining layer's alpha table is ALSO halved against marble_dark.svg
       (peak 0.20 instead of 0.40). That layer is near-white, and fractalNoise
       concentrates values mid-range, so at the square-scale 0.40 a large part
       of the area got 30 to 40 percent white laid over it. On a dark SQUARE
       that reads as veining; spread across the whole band it washed the
       bottle-green backdrop out to a pale sage grey, lighter than the board
       beside it, and cost the creme labels contrast. At 0.20 the veining is
       still clearly visible and the backdrop colour survives.

       Everything else (both color matrices, the two stacked rects) is
       byte-identical to marble_dark.svg. -->
  <filter id="cd" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.06 0.08" numOctaves="3" seed="11" result="n"/>
    <feColorMatrix in="n" type="matrix" values="
      0    0    0    0 0.02
      0    0    0    0 0.05
      0    0    0    0 0.02
      -0.7 -0.7 -0.7 0 1.0"/>
  </filter>
  <filter id="vn" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.11 0.15" numOctaves="3" seed="8" result="n"/>
    <feColorMatrix in="n" type="matrix" values="
      0    0    0    0 0.96
      0    0    0    0 0.96
      0    0    0    0 0.96
      0.34 0.33 0.33 0 0"/>
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 0 0 0 0 0.04 0.09 0.14 0.18 0.2 0.2 0.2 0.18 0.14 0.09 0.04 0 0 0 0 0"/>
    </feComponentTransfer>
  </filter>
  <rect width="200" height="200" filter="url(#cd)"/>
  <rect width="200" height="200" filter="url(#vn)"/>
</svg>
