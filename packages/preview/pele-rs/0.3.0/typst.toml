[package]
name = "pele-rs"
version = "0.3.0"
entrypoint = "lib.typ"
authors = ["Vini Freitas <@vini-fda>"]
license = "MIT"
description = "Render Mermaid diagrams with a Rust port of pele."
repository = "https://github.com/vini-fda/pele_typst"
keywords = ["mermaid", "diagram", "flowchart", "sequence", "gantt", "uml", "chart", "graph"]
categories = ["visualization", "integration"]
compiler = "0.13.0"
# Development files, and the documentation linked from the README.
exclude = [
  "/pele_rs", "/plugin", "/target", "/tests", "/.github", "/.reference",
  "/Cargo.toml", "/Cargo.lock", "/rustfmt.toml", "/*.sh",
  "/docs", "/examples", "/gallery", "/manual.typ", "/manual.pdf", "/COMPATIBILITY.md",
  ".gitignore",
]
