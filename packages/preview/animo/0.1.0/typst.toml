[package]
name = "animo"
version = "0.1.0"
entrypoint = "src/lib.typ"
authors = ["Toon Verstraelen <Toon.Verstraelen@UGent.be>"]
license = "Apache-2.0"
description = "Build dynamic HTML and static PDF presentations."
homepage = "https://reproducible-reporting.github.io/animo/"
repository = "https://github.com/reproducible-reporting/animo"
keywords = [
  # snipwise.md BEGIN keywords
  "animation",
  "beamer",
  "handout",
  "HTML",
  "presentation",
  "reproducibility",
  "reproducible research",
  "slide",
  "slides",
  "slipshow",
  "talk",
  # snipwise.md END keywords
]
categories = ["presentation"]
compiler = "0.15.1"
# Everything a reader of the repository needs but a user of the package does not.
# Tests, probes, benchmarks and build scripts are not committed to `typst/packages` at all,
# so they are listed here as well as being absent from the submitted subtree.
# `REUSE.toml` is excluded because every published file carries its own SPDX header.
exclude = [
  ".editorconfig",
  ".envrc",
  ".github",
  ".gitignore",
  ".pre-commit-config.yaml",
  ".typst-packages",
  ".zenodo.json",
  "benchmarks",
  "CITATION.cff",
  "CLAUDE.md",
  "conftest.py",
  "CONTRIBUTING.md",
  "/docs",
  "examples",
  "planning",
  "probes",
  "pyproject.toml",
  "REUSE.toml",
  "setup.sh",
  "snipwise.md",
  "/tests",
  "tools",
  "uv.lock",
  "zensical.toml",
]
